name: Aufgusspläne aktualisieren

on:
  # Kein Zeitplan: die Uhr stößt den Lauf beim Öffnen der App an
  workflow_dispatch:
    inputs:
      sauna:
        description: "Nur diese Sauna lesen (leer = Obermain Therme)"
        required: false
        default: ""

permissions:
  contents: write

# Zwei Uhren gleichzeitig sollen nicht gegeneinander pushen
concurrency: update-plans

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pläne von den Websites lesen
        run: python aufgussplan/scripts/update_plans.py "$SAUNA"
        env:
          SAUNA: ${{ inputs.sauna }}
      - name: Änderungen committen
        run: |
          if [ -n "$(git status --porcelain aufgussplan/plans)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aufgussplan/plans
            git commit -m "Update Aufgusspläne from websites"
            git push
          fi
