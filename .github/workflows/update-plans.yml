name: Aufgusspläne aktualisieren

on:
  schedule:
    - cron: "0 5 * * 1"   # montags 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pläne von den Websites lesen
        run: python aufgussplan/scripts/update_plans.py
      - name: Änderungen committen
        run: |
          if [ -n "$(git status --porcelain aufgussplan/plans)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aufgussplan/plans
            git commit -m "Update Aufgusspläne from websites"
            git push
          fi
